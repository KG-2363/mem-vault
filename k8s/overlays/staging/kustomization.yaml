apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: memvault-staging

commonLabels:
  environment: staging

images:
  - name: REGISTRY/upload-service
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/memvault-services/upload-service
    newTag: latest
  - name: REGISTRY/enhancement-service
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/memvault-services/enhancement-service
    newTag: latest
  - name: REGISTRY/delivery-service
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/memvault-services/delivery-service
    newTag: latest
  - name: REGISTRY/auth-service
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/memvault-services/auth-service
    newTag: latest
  - name: REGISTRY/api-service
    newName: asia-south1-docker.pkg.dev/PROJECT_ID/memvault-services/api-service
    newTag: latest
