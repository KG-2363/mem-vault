apiVersion: v1
kind: ServiceAccount
metadata:
  name: upload-service
  annotations:
    iam.gke.io/gcp-service-account: memvault-upload-svc@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  labels:
    app: upload-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: upload-service
      containers:
        - name: upload-service
          image: REGISTRY/upload-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCP_PROJECT_ID
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCS_BUCKET_NAME
            - name: PUBSUB_UPLOAD_TOPIC
              value: "photo.uploaded"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
spec:
  selector:
    app: upload-service
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
