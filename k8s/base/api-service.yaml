apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service
  annotations:
    iam.gke.io/gcp-service-account: memvault-api-svc@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: api-service
      containers:
        - name: api-service
          image: REGISTRY/api-service:latest
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 50051
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCP_PROJECT_ID
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCS_BUCKET_NAME
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
