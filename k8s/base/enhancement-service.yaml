apiVersion: v1
kind: ServiceAccount
metadata:
  name: enhancement-service
  annotations:
    iam.gke.io/gcp-service-account: memvault-enhance-svc@PROJECT_ID.iam.gserviceaccount.com
---
# Enhancement service runs as a Cloud Run job triggered by Pub/Sub.
# This manifest is a fallback GKE deployment for local/on-prem scenarios.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhancement-service
  labels:
    app: enhancement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhancement-service
  template:
    metadata:
      labels:
        app: enhancement-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: enhancement-service
      containers:
        - name: enhancement-service
          image: REGISTRY/enhancement-service:latest
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCP_PROJECT_ID
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCS_BUCKET_NAME
            - name: PUBSUB_SUBSCRIPTION
              value: "photo-uploaded-enhancement-sub"
            - name: ENABLE_SKIN_TONE_CORRECTION
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
