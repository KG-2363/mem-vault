apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  annotations:
    iam.gke.io/gcp-service-account: memvault-auth-svc@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: REGISTRY/auth-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: memvault-config
                  key: GCP_PROJECT_ID
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
