memvault:
  target: staging
  outputs:
    staging:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics_staging
      location: asia-south1
      threads: 4
      timeout_seconds: 300

    production:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics
      location: asia-south1
      threads: 8
      timeout_seconds: 600
